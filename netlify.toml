[build]
base = "."
command = "npm run build"
publish = "dist"

[build.environment]
VITE_DEMO_MODE = "true"

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), serial=()"
